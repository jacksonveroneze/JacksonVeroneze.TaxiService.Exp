version: "3.9"

services:
  api:
    image: jacksonveroneze/taxi-service-exp:latest
    restart: always
    tty: true
    build:
      context: ../../src
      dockerfile: ./Dockerfile
    environment:
      - APP_CONFIG_Database__ReadConnectionString=Host=10.0.0.150;Port=6432;Database=taxiservice;Username=postgres;Password=localP@ssword;Maximum Pool Size=200;Minimum Pool Size=10;Timeout=10;Command Timeout=20
      - APP_CONFIG_Bus__Address=10.0.0.199
      - APP_CONFIG_Cache__Type=Memory
      - Serilog__WriteTo__0__Args__configure__1__Name=Seq
      - Serilog__WriteTo__0__Args__configure__1__Args__serverUrl=http://10.0.0.199:5341
      - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
    healthcheck:
      test: curl --silent --fail http://localhost:8080/health?source=docker || exit 1
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    ports:
      - "8085:8080"
    logging:
      driver: "json-file"
      options:
        max-file: 2
        max-size: 1m
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: '512M'
        reservations:
          cpus: '1'
          memory: '512M'
          
  bouncer:
    image: bitnami/pgbouncer:latest
    restart: always
    tty: true
    environment:
      - POSTGRESQL_HOST=10.0.0.199
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=localP@ssword
      - POSTGRESQL_PORT=5432
      - PGBOUNCER_DATABASE=taxiservice
      - PGBOUNCER_MAX_CLIENT_CONN=1100
      - PGBOUNCER_DEFAULT_POOL_SIZE=200
      - PGBOUNCER_RESERVE_POOL_SIZE=20
      - PGBOUNCER_POOL_MODE=transaction
    logging:
      driver: "json-file"
      options:
        max-file: "2"
        max-size: "1m"
    ports:
      - "6432:6432"
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
        reservations:
          cpus: '2'
          memory: 1024M