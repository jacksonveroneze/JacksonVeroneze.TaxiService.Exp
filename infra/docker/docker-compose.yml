services:
  api:
    image: jacksonveroneze/taxi-service-exp:latest
    restart: unless-stopped
    tty: true
    build:
      context: ../../src
      dockerfile: ./Dockerfile
    env_file:
      - .env
    healthcheck:
      test: curl --silent --fail http://localhost:8080/health?source=docker || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 3s
    ports:
      - "8085:8080"
    networks:
      - taxi-service
    logging:
      driver: "json-file"
      options:
        max-file: 2
        max-size: 1m
    deploy:
      resources:
        reservations:
          cpus: '1'
          memory: '512M'
        limits:
          cpus: '1'
          memory: '512M'
  
  bouncer:
    image: bitnami/pgbouncer:latest
    restart: always
    tty: true
    logging:
      driver: "json-file"
      options:
        max-file: "2"
        max-size: "1m"
    ports:
      - "6432:6432"
    networks:
      - taxi-service
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
        reservations:
          cpus: '2'
          memory: 1024M
          
networks:
  taxi-service:
    driver: bridge