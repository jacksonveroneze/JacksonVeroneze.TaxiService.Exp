services:
  api:
    image: jacksonveroneze/taxi-service-exp:latest
    restart: unless-stopped
    build:
      context: ../../src
      dockerfile: ./Dockerfile
    env_file:
      - .env
    depends_on:
      - bouncer
    ports:
      - "8085:8080"
    networks:
      - taxi-service
    logging:
      driver: "json-file"
      options:
        max-file: "2"
        max-size: "1m"
    deploy:
      resources:
        reservations:
          cpus: '2'
          memory: '1024M'
        limits:
          cpus: '2'
          memory: '1024M'
  
  bouncer:
    image: bitnami/pgbouncer:latest
    restart: unless-stopped
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-file: "2"
        max-size: "1m"
    ports:
      - "6432:6432"
    networks:
      - taxi-service
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1024M
        reservations:
          cpus: '2'
          memory: 1024M

networks:
  taxi-service:
    driver: bridge